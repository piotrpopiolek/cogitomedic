# Produkcja: Gunicorn, PostgreSQL, scheduler, Nginx + observability (Prometheus, Grafana, Tempo,
# Alertmanager, OTel Collector) — bez devowych override'ów (brak SMSAPI_USE_MOCK, brak montowania .:/app).
# Uruchomienie: skopiuj .env z .env.example, potem:
#   docker compose -f docker-compose.prod.yml up -d --build
# Porty 3000/9090/9093/3200/4317-4318 są mapowane na host — na VPS zabezpiecz (firewall / tylko localhost / VPN),
# zmień hasło Grafana (GF_SECURITY_ADMIN_PASSWORD), patrz docs/observability-setup.md.
# Jednorazowe manage.py: docker compose -f docker-compose.prod.yml run --rm --entrypoint python web manage.py <komenda>

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cogitomedica}
      POSTGRES_USER: ${DB_USER:-cogito_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cogito_user} -d ${DB_NAME:-cogitomedica}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_SOURCE_URI: "db:5432/${DB_NAME:-cogitomedica}?sslmode=disable"
      DATA_SOURCE_USER: ${DB_USER:-cogito_user}
      DATA_SOURCE_PASS: ${DB_PASSWORD:-1234}
    depends_on:
      db:
        condition: service_healthy

  web:
    # Osobny tag od dev (`docker-compose.yml` → cogitomedica-web:dev), żeby nie nadpisywać tego samego :latest.
    image: cogitomedica-web:prod
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      # Domyślnie eksport spanów do kolektora w tym samym compose; wyłącz: OTEL_EXPORTER_OTLP_ENDPOINT= w .env
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_SERVICE_NAME: cogitomedica-web
    volumes:
      - staticfiles_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # Skrypt zamiast inline python -c: unika problemów z cytowaniem / CRLF w YAML na Windowsie.
    # Nie używamy HTTP do /health: przy SECURE_SSL_REDIRECT=1 przekierowanie na HTTPS psuje urllib.
    healthcheck:
      test: ["CMD", "sh", "/app/scripts/docker-healthcheck-web.sh"]
      interval: 15s
      timeout: 15s
      retries: 8
      start_period: 120s

  scheduler:
    image: cogitomedica-scheduler:prod
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318/v1/traces}
      OTEL_SERVICE_NAME: cogitomedica-scheduler
    entrypoint: ["python", "manage.py"]
    command:
      [
        "run_periodic_tasks",
        "--interval-seconds",
        "300",
        "--skip-import",
      ]
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      # Po dodaniu bloku listen 443 ssl w nginx.prod.conf i zamontowaniu certyfikatów:
      # - "443:443"
    volumes:
      - ./deploy/nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - staticfiles_data:/var/www/static:ro
      - media_data:/var/www/media:ro
    depends_on:
      web:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./deploy/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s|__PROMETHEUS_METRICS_TOKEN__|$$PROMETHEUS_METRICS_TOKEN|g" /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.console.libraries=/etc/prometheus/console_libraries \
          --web.console.templates=/etc/prometheus/consoles
    ports:
      - "9090:9090"
    depends_on:
      web:
        condition: service_healthy
      postgres_exporter:
        condition: service_started

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./deploy/prometheus:/etc/cogito-prometheus:ro
      - alertmanager_data:/alertmanager
    entrypoint:
      - /bin/sh
      - -c
      - |
        WEBHOOK="$${ALERTMANAGER_WEBHOOK_URL:-http://127.0.0.1:5001/}"
        sed "s|__ALERTMANAGER_WEBHOOK_URL__|$${WEBHOOK}|g" /etc/cogito-prometheus/alertmanager.yml.template > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    ports:
      - "9093:9093"

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./deploy/otel/otel-collector-config.yml:/etc/otel-collector-config.yml
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - tempo

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  postgres_data:
  staticfiles_data:
  media_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  tempo_data:
