# Produkcja: Gunicorn, PostgreSQL, scheduler, Nginx — bez devowych override'ów (brak SMSAPI_USE_MOCK, brak .:/app).
# Domyślnie: db, web, scheduler, nginx (porty 80 i 443 na hoście). Bez wystawionych portów monitoringu.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Stack observability (Prometheus, postgres_exporter, Alertmanager, Tempo, OTel Collector, Grafana) —
# profile `observability`. Porty na hoście domyślnie tylko na loopback (${OBSERVABILITY_BIND_ADDR:-127.0.0.1}) —
# nie są dostępne z Internetu; dostęp z laptopa: ssh -L 3000:127.0.0.1:3000 … potem http://127.0.0.1:3000.
# Świadome wystawienie na wszystkich interfejsach: OBSERVABILITY_BIND_ADDR=0.0.0.0 w .env (+ firewall).
#
#   docker compose -f docker-compose.prod.yml --profile observability up -d --build
#
# Przy włączonym profilu ustaw w .env eksport trace’ów, np.:
#   OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces
# (bez tego web/scheduler nie wysyłają spanów do kolektora). PROMETHEUS_METRICS_TOKEN + `web` w ALLOWED_HOSTS: docs/observability-setup.md.
# Jednorazowe manage.py: docker compose -f docker-compose.prod.yml run --rm --entrypoint python web manage.py <komenda>

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cogitomedica}
      POSTGRES_USER: ${DB_USER:-cogito_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cogito_user} -d ${DB_NAME:-cogitomedica}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_exporter:
    profiles: [observability]
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_SOURCE_URI: "db:5432/${DB_NAME:-cogitomedica}?sslmode=disable"
      DATA_SOURCE_USER: ${DB_USER:-cogito_user}
      DATA_SOURCE_PASS: ${DB_PASSWORD:-1234}
    depends_on:
      db:
        condition: service_healthy

  node_exporter:
    profiles: [observability]
    image: prom/node-exporter:v1.9.0
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host

  web:
    # Osobny tag od dev (`docker-compose.yml` → cogitomedica-web:dev), żeby nie nadpisywać tego samego :latest.
    image: cogitomedica-web:prod
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      # OTEL_EXPORTER_OTLP_ENDPOINT z .env — ustaw przy --profile observability (np. http://otel-collector:4318/v1/traces).
      OTEL_SERVICE_NAME: cogitomedica-web
    volumes:
      - staticfiles_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    # Skrypt zamiast inline python -c: unika problemów z cytowaniem / CRLF w YAML na Windowsie.
    # Nie używamy HTTP do /health: przy SECURE_SSL_REDIRECT=1 przekierowanie na HTTPS psuje urllib.
    healthcheck:
      test: ["CMD", "sh", "/app/scripts/docker-healthcheck-web.sh"]
      interval: 15s
      timeout: 15s
      retries: 8
      start_period: 120s

  scheduler:
    image: cogitomedica-scheduler:prod
    build:
      context: .
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      OTEL_SERVICE_NAME: cogitomedica-scheduler
    entrypoint: ["python", "manage.py"]
    command:
      [
        "run_periodic_tasks",
        "--interval-seconds",
        "300",
        "--skip-import",
      ]
    volumes:
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NGINX_PUBLIC_HOST: ${NGINX_PUBLIC_HOST:-portal.example.com}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.prod.conf.template:/etc/nginx/nginx.prod.conf.template:ro
      - staticfiles_data:/var/www/static:ro
      - ./deploy/nginx/certbot-webroot:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      web:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        sed "s|__NGINX_PUBLIC_HOST__|$$NGINX_PUBLIC_HOST|g" /etc/nginx/nginx.prod.conf.template > /etc/nginx/conf.d/default.conf
        exec nginx -g 'daemon off;'

  prometheus:
    profiles: [observability]
    image: prom/prometheus:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./deploy/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s|__PROMETHEUS_METRICS_TOKEN__|$$PROMETHEUS_METRICS_TOKEN|g" /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.console.libraries=/etc/prometheus/console_libraries \
          --web.console.templates=/etc/prometheus/consoles
    ports:
      - "${OBSERVABILITY_BIND_ADDR:-127.0.0.1}:9090:9090"
    depends_on:
      web:
        condition: service_healthy
      postgres_exporter:
        condition: service_started
      node_exporter:
        condition: service_started
      otel-collector:
        condition: service_started
    # Wpis do /etc/hosts w prometheus (DNS Compose); scraper widzi hosty po recreate kontenera.
    links:
      - otel-collector:otelcollector
      - node_exporter:node_exporter
      - postgres_exporter:postgres_exporter

  alertmanager:
    profiles: [observability]
    image: prom/alertmanager:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./deploy/prometheus:/etc/cogito-prometheus:ro
      - alertmanager_data:/alertmanager
    entrypoint:
      - /bin/sh
      - -c
      - |
        DEFAULT="$${ALERTMANAGER_WEBHOOK_URL:-http://127.0.0.1:5001/}"
        CRITICAL="$${ALERTMANAGER_WEBHOOK_CRITICAL_URL:-$$DEFAULT}"
        WARNING="$${ALERTMANAGER_WEBHOOK_WARNING_URL:-$$DEFAULT}"
        if [ "$${ALERTMANAGER_USE_DISCORD:-0}" = "1" ]; then
          SRC="/etc/cogito-prometheus/alertmanager.discord.yml.template"
        else
          SRC="/etc/cogito-prometheus/alertmanager.yml.template"
        fi
        sed -e "s#__WEBHOOK_DEFAULT__#$${DEFAULT}#g" \
            -e "s#__WEBHOOK_CRITICAL__#$${CRITICAL}#g" \
            -e "s#__WEBHOOK_WARNING__#$${WARNING}#g" \
            "$$SRC" > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    ports:
      - "${OBSERVABILITY_BIND_ADDR:-127.0.0.1}:9093:9093"

  tempo:
    profiles: [observability]
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    ports:
      - "${OBSERVABILITY_BIND_ADDR:-127.0.0.1}:3200:3200"

  otel-collector:
    profiles: [observability]
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./deploy/otel/otel-collector-config.yml:/etc/otel-collector-config.yml
    networks:
      default:
        aliases:
          - otelcollector
    ports:
      - "${OBSERVABILITY_BIND_ADDR:-127.0.0.1}:4317:4317"
      - "${OBSERVABILITY_BIND_ADDR:-127.0.0.1}:4318:4318"
      - "${OBSERVABILITY_BIND_ADDR:-127.0.0.1}:8889:8889"
    depends_on:
      - tempo

  grafana:
    profiles: [observability]
    image: grafana/grafana:latest
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    ports:
      - "${OBSERVABILITY_BIND_ADDR:-127.0.0.1}:3000:3000"
    depends_on:
      - prometheus
      - tempo

volumes:
  postgres_data:
  staticfiles_data:
  media_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  tempo_data:
