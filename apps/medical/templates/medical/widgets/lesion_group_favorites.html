{% load cogitomedica_i18n %}
<div id="lesion-group-favorites-{{ widget.attrs.id }}" class="lesion-group-favorites-widget group" x-data="lesionGroupFavoritesWidget(
  atob('{{ widget.value_b64 }}'),
  atob('{{ widget.dermatoscopic_b64 }}'),
  atob('{{ widget.clinical_b64 }}'),
  atob('{{ widget.malignancy_b64 }}')
)">
  <textarea name="{{ widget.name }}" x-ref="textarea" id="{{ widget.attrs.id }}"
    class="{{ widget.textarea_json_class }}"
    rows="4"
    aria-label="{% db_trans 'doctor.widget_lgf_json_label' 'Lesion group favorites (JSON)' %}"
  >{{ widget.value_json }}</textarea>
  <p class="{{ widget.help_line_class }} mb-3">{% db_trans "doctor.widget_lgf_help_text" "With JavaScript enabled, use the visual editor below; it syncs to the JSON above. Without JavaScript, edit the JSON directly." %}</p>
  <div class="space-y-4 max-w-4xl">
    <template x-for="(preset, index) in presets" :key="index">
      <div class="{{ widget.preset_card_class }}">
        <div class="flex justify-between items-center gap-2">
          <span class="{{ widget.preset_heading_class }}" x-text="'Preset ' + (index + 1)"></span>
          <button type="button" @click="removePreset(index)"
            class="{{ widget.remove_button_class }}">
            {% db_trans "doctor.widget_remove" "Remove" %}
          </button>
        </div>
        <div>
          <label class="{{ widget.label_class }}">{% db_trans "doctor.widget_name" "Name" %}</label>
          <input type="text" x-model="preset.name" maxlength="120"
            class="{{ widget.input_class }}"
            placeholder="e.g. Zmiana kontrolna">
        </div>
        <div>
          <label class="{{ widget.label_class }}">{% db_trans "doctor.widget_clinical_assessment" "Clinical assessment" %}</label>
          <select x-model="preset.clinical_assessment"
            class="{{ widget.select_class }}">
            <option value="">{% db_trans "doctor.widget_select_placeholder" "— Select —" %}</option>
            {% for value, label in widget.clinical_choices %}
            <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="{{ widget.label_class }}">{% db_trans "doctor.widget_malignancy_risk" "Malignancy risk" %}</label>
          <select x-model="preset.malignancy_risk"
            class="{{ widget.select_class }}">
            <option value="">{% db_trans "doctor.widget_select_placeholder" "— Select —" %}</option>
            {% for value, label in widget.malignancy_choices %}
            <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
          </select>
        </div>
        <div>
          <label class="{{ widget.label_class }}">{% db_trans "doctor.widget_dermatoscopic_features" "Dermatoscopic features" %}</label>
          <div class="flex flex-wrap gap-x-4 gap-y-2">
            <template x-for="opt in dermatoscopicChoices" :key="opt.value">
              <label class="{{ widget.checkbox_row_label_class }}">
                <input type="checkbox" :checked="preset.dermatoscopic_features.includes(opt.value)"
                  @change="toggleFeature(preset, opt.value)"
                  class="{{ widget.checkbox_class }}">
                <span x-text="opt.label"></span>
              </label>
            </template>
          </div>
        </div>
        <div>
          <label class="{{ widget.label_class }}">{% db_trans "doctor.widget_text_section_8" "Text (section 8)" %}</label>
          <textarea x-model="preset.text" maxlength="5000" rows="3"
            class="{{ widget.textarea_body_class }}"
            placeholder="{% db_trans 'doctor.widget_text_section_8_placeholder' 'Text for section 8 (generated / edited)' %}"></textarea>
        </div>
      </div>
    </template>
    <button type="button" @click="addPreset()"
      class="{{ widget.add_preset_button_class }}">
      {% db_trans "doctor.widget_add_preset" "Add preset" %}
    </button>
  </div>
</div>
<script>
document.addEventListener('alpine:init', function() {
  Alpine.data('lesionGroupFavoritesWidget', function(initialJson, dermatoscopicJson, clinicalJson, malignancyJson) {
    var parse = function(s) {
      try { return JSON.parse(s || '[]'); } catch (e) { return []; }
    };
    var emptyPreset = function() {
      return { name: '', dermatoscopic_features: [], clinical_assessment: '', malignancy_risk: '', text: '' };
    };
    return {
      presets: parse(initialJson),
      dermatoscopicChoices: parse(dermatoscopicJson),
      clinicalChoices: parse(clinicalJson),
      malignancyChoices: parse(malignancyJson),
      init: function() {
        var self = this;
        this.$watch('presets', function() { self.syncToTextarea(); }, { deep: true });
        this.syncToTextarea();
      },
      syncToTextarea: function() {
        var ta = this.$refs.textarea;
        if (ta) ta.value = JSON.stringify(this.presets);
      },
      addPreset: function() {
        this.presets.push(emptyPreset());
      },
      removePreset: function(index) {
        this.presets.splice(index, 1);
      },
      toggleFeature: function(preset, code) {
        var i = preset.dermatoscopic_features.indexOf(code);
        if (i === -1) preset.dermatoscopic_features.push(code);
        else preset.dermatoscopic_features.splice(i, 1);
      }
    };
  });
});
</script>
