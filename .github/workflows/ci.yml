name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install linters (same pins as pre-commit / requirements-dev)
        run: pip install -r requirements-dev.txt

      - name: ruff check
        run: ruff check .

      - name: black --check
        run: black --check .

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: mypy
        run: mypy .

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cogitomedica
          POSTGRES_USER: cogito_user
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECRET_KEY: ci-secret-key-for-testing-only
      DB_NAME: cogitomedica
      DB_USER: cogito_user
      DB_PASSWORD: ci-password
      DB_HOST: localhost
      DB_PORT: "5432"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_TIME_ZONE: Europe/Warsaw
      PROMETHEUS_METRICS_TOKEN: ci-metrics-token
      PATIENT_RESULTS_BASE_URL: http://localhost:8000
      PATIENT_RESULTS_OTP_PEPPER: ci-test-pepper
      SMSAPI_USE_MOCK: "1"
      HIDRIVE_USE_MOCK: "1"
      CAPTCHA_VERIFY_SKIP: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install system dependencies (WeasyPrint + gettext + libpq)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libcairo2 \
            libglib2.0-0 \
            libpango-1.0-0 \
            libpangoft2-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info \
            fonts-dejavu-core \
            libpq-dev \
            gettext

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Migrate
        run: python manage.py migrate

      - name: Load default translations
        run: python manage.py load_default_translations

      - name: Check translations completeness
        run: python manage.py check_translations_completeness

      - name: Run pytest (coverage gate from pyproject)
        run: python -m pytest -q --tb=short --cov --cov-report=xml --cov-report=term-missing
        timeout-minutes: 30

      - name: Diff coverage
        run: diff-cover coverage.xml --compare-branch=origin/main --fail-under=90

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 7

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build .
