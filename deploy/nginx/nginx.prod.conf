# Produkcyjny reverse proxy (Docker). Montowany jako /etc/nginx/conf.d/default.conf
# TLS: zamontuj certyfikaty (np. Let's Encrypt) i dodaj osobny server { listen 443 ssl; ... }
# lub terminuj TLS na hoście przed kontenerem nginx.
#
# Brak bloku upstream { server web:8000; } — nginx przy starcie rozwija nazwę "web" zanim DNS
# Dockera ją poda ("host not found in upstream"). Zamiast tego: resolver wbudowany DNS Dockera
# (127.0.0.11) + proxy_pass ze zmienną — rozwiązanie hosta przy żądaniu.

server {
    listen 80;
    server_name _;

    # Docker embedded DNS (zob. docker network inspect)
    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 50m;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/media/;
        autoindex off;
    }

    location / {
        set $cogito_web_upstream web:8000;
        proxy_pass http://$cogito_web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
