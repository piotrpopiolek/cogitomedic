# Produkcyjny reverse proxy (Docker). Montowany jako /etc/nginx/conf.d/default.conf
#
# Certyfikaty: montaż /etc/letsencrypt z hosta (certbot). Dostosuj ścieżki i server_name
# jeśli używasz innej domeny niż poniżej.
#
# Brak bloku upstream { server web:8000; } — używamy resolvera Dockera + proxy_pass ze zmienną
# (patrz location / w bloku 443).

# --- HTTP: ACME (odnowienia certbot --webroot) + przekierowanie na HTTPS ---
server {
    listen 80;
    server_name ergebnisse.cogitomedica.de;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl http2;
    server_name ergebnisse.cogitomedica.de;

    ssl_certificate     /etc/letsencrypt/live/ergebnisse.cogitomedica.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ergebnisse.cogitomedica.de/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Docker embedded DNS (zob. docker network inspect)
    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 50m;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/media/;
        autoindex off;
    }

    location / {
        set $cogito_web_upstream web:8000;
        proxy_pass http://$cogito_web_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
