# Produkcyjny reverse proxy (Docker). Montowany jako /etc/nginx/conf.d/default.conf
# TLS: zamontuj certyfikaty (np. Let's Encrypt) i dodaj osobny server { listen 443 ssl; ... }
# lub terminuj TLS na hoście przed kontenerem nginx.

upstream cogitomedica_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 50m;

    location /static/ {
        alias /var/www/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /var/www/media/;
        autoindex off;
    }

    location / {
        proxy_pass http://cogitomedica_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
