# Prometheus jako domyślne źródło danych (opcjonalnie – można dodać ręcznie w UI).
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      nodeGraph:
        enabled: true
      tracesToMetrics:
        datasourceUid: prometheus
        spanStartTimeShift: -1h
        spanEndTimeShift: 1h
        tags:
          - key: service.name
            value: service
        queries:
          - name: Span call rate
            query: sum(rate(calls_total{$$__tags}[5m]))
          - name: Span duration p95 ms
            query: histogram_quantile(0.95, sum(rate(duration_milliseconds_bucket{$$__tags}[5m])) by (le))
