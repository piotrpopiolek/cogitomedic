global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alerts.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: "cogitomedica_web"
    metrics_path: "/api/v1/observability/metrics"
    authorization:
      # Matches PROMETHEUS_METRICS_TOKEN in .env
      credentials: "change-me-in-local-env"
    static_configs:
      - targets: ["web:8000"]