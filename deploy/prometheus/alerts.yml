groups:
  - name: cogitomedica_node_recording
    rules:
      - record: cogitomedica:node_root_filesystem_used_percent
        expr: |
          max by (instance) (
            (
              1 -
              node_filesystem_avail_bytes{
                fstype!~"tmpfs|overlay|squashfs|aufs|devtmpfs",
                mountpoint=~"/rootfs|/"
              }
              /
              node_filesystem_size_bytes{
                fstype!~"tmpfs|overlay|squashfs|aufs|devtmpfs",
                mountpoint=~"/rootfs|/"
              }
            ) * 100
          )

  - name: cogitomedica_host_disk_alerts
    rules:
      - alert: NodeExporterTargetDown
        expr: up{job="node"} == 0
        for: 5m
        labels:
          severity: warning
          component: host_disk
        annotations:
          summary: "Prometheus nie zbiera metryk node_exporter (dysk hosta)."
          description: "Sprawdź kontener node_exporter i profil observability. Bez tego alerty zajętości dysku nie działają."

      - alert: DiskUsageAbove50Percent
        expr: cogitomedica:node_root_filesystem_used_percent >= 50
        for: 10m
        labels:
          severity: warning
          component: host_disk
          disk_threshold_percent: "50"
        annotations:
          summary: "Dysk VPS ≥ 50% ({{ $value | printf \"%.1f\" }}%)."
          description: "Zajętość partycji root rośnie. Po retencji PDF (PDF_RETENTION_DAYS, domyślnie 60 dni) i cronie run_retention_cleanup może spaść — wtedy alert przejdzie w Resolved. Runbook: docs/runbooks/DISK_USAGE.md"

      - alert: DiskUsageAbove60Percent
        expr: cogitomedica:node_root_filesystem_used_percent >= 60
        for: 10m
        labels:
          severity: warning
          component: host_disk
          disk_threshold_percent: "60"
        annotations:
          summary: "Dysk VPS ≥ 60% ({{ $value | printf \"%.1f\" }}%)."
          description: "Runbook: docs/runbooks/DISK_USAGE.md. Spadek poniżej progu (np. po retencji lokalnych PDF) zamyka alert."

      - alert: DiskUsageAbove70Percent
        expr: cogitomedica:node_root_filesystem_used_percent >= 70
        for: 10m
        labels:
          severity: warning
          component: host_disk
          disk_threshold_percent: "70"
        annotations:
          summary: "Dysk VPS ≥ 70% ({{ $value | printf \"%.1f\" }}%)."
          description: "Runbook: docs/runbooks/DISK_USAGE.md. Zaplanuj czyszczenie / rozszerzenie dysku."

      - alert: DiskUsageAbove80Percent
        expr: cogitomedica:node_root_filesystem_used_percent >= 80
        for: 10m
        labels:
          severity: critical
          component: host_disk
          disk_threshold_percent: "80"
        annotations:
          summary: "Dysk VPS ≥ 80% ({{ $value | printf \"%.1f\" }}%) — krytyczne."
          description: "Pilnie: df -h, docker system df -v, du na /var/lib/docker. Runbook: docs/runbooks/DISK_USAGE.md"

      - alert: DiskUsageAbove90Percent
        expr: cogitomedica:node_root_filesystem_used_percent >= 90
        for: 10m
        labels:
          severity: critical
          component: host_disk
          disk_threshold_percent: "90"
        annotations:
          summary: "Dysk VPS ≥ 90% ({{ $value | printf \"%.1f\" }}%) — pilne."
          description: "Ryzyko awarii DB/aplikacji. Runbook: docs/runbooks/DISK_USAGE.md"

  - name: cogitomedica_outbox_alerts
    rules:
      # PRD: krytyczny w godzinach pracy — okno godzinowe ustaw w Alertmanagerze (mute_time_intervals / routes), nie w PromQL (unika błędów wektorów).
      - alert: OutboxBacklogTooOld
        expr: |
          max(cogitomedica_outbox_pending_age_seconds) > 900
          or
          max(cogitomedica_intake_outbox_pending_age_seconds) > 900
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Medical or intake outbox pending age exceeds 15 minutes."
          description: "Zaległe zdarzenie asynchroniczne od 15 minut (tylko PENDING/FAILED). DEAD_LETTER nie wchodzi w ten gauge — patrz OutboxDeadLetterPresent. Runbook: docs/runbooks/OUTBOX_BACKLOG_AGE.md — dla PRD (tylko godziny pracy) dodaj mute/route w Alertmanagerze."

      # DEAD_LETTER is excluded from *_pending_age_seconds (PENDING|FAILED only). Without this
      # rule, backlog age can drop to 0 while documents remain stuck after max_retries.
      - alert: OutboxDeadLetterPresent
        expr: |
          max(cogitomedica_outbox_events_total{status="DEAD_LETTER"}) > 0
          or
          max(cogitomedica_intake_outbox_events_total{status="DEAD_LETTER"}) > 0
        for: 5m
        labels:
          severity: critical
          component: outbox
        annotations:
          summary: "Medical or intake outbox has DEAD_LETTER events (stuck after max retries)."
          description: "Co najmniej jedno zdarzenie outbox ma status DEAD_LETTER — nie wznawia się automatycznie. Dashboard recepcji /admin/reception-dashboard/ lub /admin/outbox/outboxevent/; Ponów po usunięciu przyczyny. Runbook: docs/runbooks/OUTBOX_BACKLOG_AGE.md §DEAD_LETTER."

      - alert: IntegrationErrorSpike
        expr: |
          sum(increase(cogitomedica_outbox_executions_total{stream="befund",result=~"failed|dead_letter",event_type=~"HIDRIVE_UPLOAD|SMS_SEND"}[10m])) > 0
          or
          sum(increase(cogitomedica_outbox_executions_total{stream="intake",result=~"failed|dead_letter",event_type="HIDRIVE_UPLOAD_INTAKE_PDF"}[10m])) > 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Outbox integration failures in the last 10 minutes (HiDrive/SMS or intake HiDrive)."
          description: "Błędy przetwarzania outbox. Runbook: docs/runbooks/INTEGRATION_ERROR.md"

      - alert: LowSuccessRatio
        expr: |
          (
            sum by (event_type) (rate(cogitomedica_outbox_executions_total{stream="befund",result="success",event_type=~"HIDRIVE_UPLOAD|SMS_SEND"}[1h]))
            /
            sum by (event_type) (rate(cogitomedica_outbox_executions_total{stream="befund",event_type=~"HIDRIVE_UPLOAD|SMS_SEND"}[1h]))
          ) < 0.98
          and
          sum by (event_type) (rate(cogitomedica_outbox_executions_total{stream="befund",event_type=~"HIDRIVE_UPLOAD|SMS_SEND"}[1h])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Success ratio for {{ $labels.event_type }} dropped below 98% in the last hour."
          description: "Wskaźnik sukcesu poniżej 98%. Możliwa degradacja integracji."

  - name: cogitomedica_postgres_infra
    rules:
      - alert: PostgresExporterTargetDown
        expr: up{job="postgres"} == 0
        for: 3m
        labels:
          severity: warning
        annotations:
          summary: "Prometheus nie zbiera metryk z postgres_exporter."
          description: "Sprawdź kontener postgres_exporter i sieć Docker (job postgres)."

      - alert: PostgresDatabaseUnreachable
        expr: up{job="postgres"} == 1 and pg_up{job="postgres"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "postgres_exporter działa, ale nie łączy się z PostgreSQL (pg_up=0)."
          description: "Weryfikuj DB_HOST/DB_USER/DB_PASSWORD/DB_NAME oraz stan kontenera db."
