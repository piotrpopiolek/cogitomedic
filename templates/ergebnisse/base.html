<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Ergebnisse – CogitoMed{% endblock %}</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 480px; margin: 0 auto; padding: 1rem; }
    h1 { font-size: 1.25rem; }
    a.btn { display: inline-block; padding: 0.75rem 1.25rem; margin: 0.5rem 0; background: #0d6efd; color: #fff; text-align: center; text-decoration: none; border-radius: 6px; font-size: 1rem; }
    a.btn:hover { background: #0b5ed7; }
    a.btn.secondary { background: #6c757d; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { margin: 0.25rem 0; }
    .error { color: #b02a37; margin: 0.5rem 0; }
    input { width: 100%; padding: 0.75rem; margin: 0.5rem 0; box-sizing: border-box; font-size: 1rem; }
    button { width: 100%; padding: 1rem; margin-top: 0.5rem; font-size: 1rem; cursor: pointer; background: #0d6efd; color: #fff; border: none; border-radius: 6px; }
    button:hover { background: #0b5ed7; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% block content %}{% endblock %}
</body>
</html>
