<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}{{ ergebnisse_ui.page_title|default:"Ergebnisse – CogitoMed" }}{% endblock %}</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 480px; margin: 0 auto; padding: 1rem; }
    h1 { font-size: 1.25rem; }
    a.btn { display: inline-block; padding: 0.75rem 1.25rem; margin: 0.5rem 0; background: #0d6efd; color: #fff; text-align: center; text-decoration: none; border-radius: 6px; font-size: 1rem; }
    a.btn:hover { background: #0b5ed7; }
    a.btn.secondary { background: #6c757d; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { margin: 0.25rem 0; }
    .error { color: #b02a37; margin: 0.5rem 0; }
    input { width: 100%; padding: 0.75rem; margin: 0.5rem 0; box-sizing: border-box; font-size: 1rem; }
    button { width: 100%; padding: 1rem; margin-top: 0.5rem; font-size: 1rem; cursor: pointer; background: #0d6efd; color: #fff; border: none; border-radius: 6px; }
    button:hover { background: #0b5ed7; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  {% if ergebnisse_ui %}
  <nav class="ergebnisse-lang-nav" aria-label="Wybierz język" style="display:flex;justify-content:flex-end;align-items:center;gap:0.5rem;margin-bottom:0.5rem;font-size:1.5rem;line-height:1">
    {% if ergebnisse_locale == 'en' %}
      <a href="?locale=de" title="{{ ergebnisse_ui.lang_de|default:'Deutsch' }}"><span aria-hidden="true">🇩🇪</span></a>
      <span title="{{ ergebnisse_ui.lang_en|default:'English' }}">🇬🇧</span>
      <a href="?locale=pl" title="{{ ergebnisse_ui.lang_pl|default:'Polski' }}"><span aria-hidden="true">🇵🇱</span></a>
    {% elif ergebnisse_locale == 'pl' %}
      <a href="?locale=de" title="{{ ergebnisse_ui.lang_de|default:'Deutsch' }}"><span aria-hidden="true">🇩🇪</span></a>
      <a href="?locale=en" title="{{ ergebnisse_ui.lang_en|default:'English' }}"><span aria-hidden="true">🇬🇧</span></a>
      <span title="{{ ergebnisse_ui.lang_pl|default:'Polski' }}">🇵🇱</span>
    {% else %}
      <span title="{{ ergebnisse_ui.lang_de|default:'Deutsch' }}">🇩🇪</span>
      <a href="?locale=en" title="{{ ergebnisse_ui.lang_en|default:'English' }}"><span aria-hidden="true">🇬🇧</span></a>
      <a href="?locale=pl" title="{{ ergebnisse_ui.lang_pl|default:'Polski' }}"><span aria-hidden="true">🇵🇱</span></a>
    {% endif %}
  </nav>
  {% endif %}
  {% block content %}{% endblock %}
</body>
</html>
