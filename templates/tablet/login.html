<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tablet – logowanie</title>
  <style>
    body { font-family: sans-serif; max-width: 360px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    input { width: 100%; padding: 0.75rem; margin: 0.5rem 0; box-sizing: border-box; font-size: 1rem; }
    button { width: 100%; padding: 1rem; margin-top: 0.5rem; font-size: 1rem; cursor: pointer; background: #0d6efd; color: #fff; border: none; border-radius: 6px; }
    .error { color: #b02a37; margin: 0.5rem 0; }
  </style>
</head>
<body>
  <h1>Poczekalnia – logowanie</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="" id="tablet-login-form">
    {% csrf_token %}
    <input type="hidden" name="android_id" id="tablet-login-android-id" value="" />
    <label for="username">Login</label>
    <input id="username" name="username" type="text" required autocomplete="username" />
    <label for="password">Hasło</label>
    <input id="password" name="password" type="password" required autocomplete="current-password" />
    <button type="submit">Zaloguj</button>
  </form>
  <script>
    (function() {
      try {
        var key = 'tablet_android_id';
        var id = localStorage.getItem(key);
        if (!id) {
          id = typeof crypto !== 'undefined' && crypto.randomUUID ? crypto.randomUUID() : 'web-' + Date.now() + '-' + Math.random().toString(36).slice(2, 12);
          localStorage.setItem(key, id);
        }
        var el = document.getElementById('tablet-login-android-id');
        if (el) el.value = id;
      } catch (e) {}
    })();
  </script>
</body>
</html>
