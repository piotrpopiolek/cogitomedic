<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Arztbereich{% endblock %} – CogitoMedica</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    .nav-doctor { background: #0d6efd; }
    .nav-doctor .navbar-brand, .nav-doctor .nav-link { color: rgba(255,255,255,.9); }
    .nav-doctor .nav-link:hover { color: #fff; }
    .status-badge { font-size: 0.75rem; }
  </style>
  {% block extrahead %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg nav-doctor">
    <div class="container-fluid">
      <a class="navbar-brand" href="{% url 'doctor-list' %}">Arztbereich</a>
      <div class="navbar-nav ms-auto">
        <span class="nav-link">{{ user.username }} ({{ user.role }})</span>
        <form method="post" action="{% url 'doctor-logout' %}" class="d-inline">{% csrf_token %}<button type="submit" class="btn btn-outline-light btn-sm ms-2">Abmelden</button></form>
      </div>
    </div>
  </nav>
  <main class="container-fluid py-4">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block extrajs %}{% endblock %}
</body>
</html>
