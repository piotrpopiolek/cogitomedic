<!DOCTYPE html>
{% load static cogitomedica_i18n %}
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="description" content="" />
    <meta name="author" content="" />
    {% db_trans "other.portal.page_title" "CogitoMedica Results" as portal_page_title %}
    <title>{{ portal_page_title }}</title>
    <!-- Favicon-->
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <!-- Core theme CSS (includes Bootstrap); brand: teal #075255, surface #f5f7f8 (jak post-17.css na cogitomedica.de) -->
    <link rel="stylesheet" href="{% static 'css/styles.css' %}?v=12" />
    <link rel="stylesheet" href="{% static 'cogitomedica/css/cogitomedica-brand.css' %}?v=2" />
  </head>
  <body>
    <!-- Navigation-->
    <nav class="navbar navbar-light bg-light static-top">
      <div class="container">
        <a class="navbar-brand" href="https://cogitomedica.de/"
          ><img src="{% static 'lab/logo.png' %}" alt="CogitoMedica."
        /></a>
        {% if user.is_authenticated %}
        <a class="btn btn-primary" href="/accounts/logout">{% db_trans "other.auth.logout" "Log out" %}</a>
        {% endif %}
      </div>
    </nav>
    {% block content %} {% endblock %}
    <!-- Footer-->
    <footer class="footer bg-light">
      <div class="container">
        <div class="row">
          <div class="col-lg-12 h-100 text-center my-auto">
            <p class="text-muted mb-4 mb-lg-0">
              © 2025:
              <a href="https://cogitomedica.de/">CogitoMedica</a>
            </p>
          </div>
        </div>
      </div>
    </footer>
    <!-- Core theme JS-->
    <script src="{% static 'js/scripts.js' %}"></script>
  </body>
</html>
