[tool.ruff]
line-length = 88
exclude = [
    "*/migrations/*",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.black]
line-length = 88
exclude = '''
/(
    migrations
)/
'''

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
exclude = [
    "migrations/",
    "scripts/",
]
