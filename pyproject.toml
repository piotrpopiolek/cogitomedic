[tool.ruff]
line-length = 88
exclude = [
    "*/migrations/*",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.black]
line-length = 88
exclude = '''
/(
    migrations
)/
'''

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
exclude = [
    "migrations/",
    "scripts/",
]

[tool.coverage.run]
branch = true
source = ["apps", "cogitomedica"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
    "cogitomedica/wsgi.py",
    "cogitomedica/asgi.py",
    "cogitomedica/formats/pl/formats.py",
    "cogitomedica/admin_callbacks.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.mutmut]
source_paths = ["apps", "cogitomedica"]
only_mutate = ["apps/medical/name_normalize.py"]
pytest_add_cli_args_test_selection = ["apps/medical/tests/test_name_normalize.py"]
# Plain Django bootstrap in mutants/conftest.py (also_copy); avoid pytest-django double-setup (#504).
pytest_add_cli_args = [
    "-c",
    "mutmut_pytest.ini",
    "--no-cov",
    "-p",
    "no:django",
]
also_copy = ["conftest.py", "mutmut_pytest.ini"]
max_stack_depth = 50

