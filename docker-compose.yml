services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-cogitomedica}
      POSTGRES_USER: ${DB_USER:-cogito_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-1234}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cogito_user} -d ${DB_NAME:-cogitomedica}"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres_exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_SOURCE_URI: "db:5432/${DB_NAME:-cogitomedica}?sslmode=disable"
      DATA_SOURCE_USER: ${DB_USER:-cogito_user}
      DATA_SOURCE_PASS: ${DB_PASSWORD:-1234}
    depends_on:
      db:
        condition: service_healthy

  node_exporter:
    image: prom/node-exporter:v1.9.0
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    pid: host

  web:
    image: cogitomedica-web:dev
    build: .
    shm_size: "1gb"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      SMSAPI_USE_MOCK: "1"
      HIDRIVE_USE_MOCK: "1"
      # Match scenario-videos / typical .env Common-space path; seed uses hidrive_incoming_dir().
      HIDRIVE_INCOMING_PATH: ${HIDRIVE_INCOMING_PATH:-/public/incoming}
      # Domyślnie puste — bez działającego otel-collector eksport OTLP timeoutuje i zaśmieca logi (np. przy nagraniach manual).
      # Włącz: dopisz do .env OTEL_EXPORTER_OTLP_ENDPOINT=http://otel-collector:4318/v1/traces i uruchom `otel-collector` (+ tempo).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: cogitomedica-web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    # 0.0.0.0 = nasłuch na wszystkich interfejsach (dostęp z tabletu po IP)
    ports:
      - "0.0.0.0:8000:8000"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    image: cogitomedica-scheduler:dev
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      SMSAPI_USE_MOCK: "1"
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SERVICE_NAME: cogitomedica-scheduler
      SCHEDULER_METRICS_PORT: "8001"
    command: >
      sh -c "python manage.py run_periodic_tasks --interval-seconds 30 --skip-import"
    volumes:
      - .:/app
    expose:
      - "8001"
    depends_on:
      db:
        condition: service_healthy

  # One-off: zrzuty ekranu do docs/manual (wymaga działającego web + DB)
  # Uruchomienie: docker compose --profile screenshots run --rm screenshots
  screenshots:
    build:
      context: .
      dockerfile: Dockerfile.screenshots
    profiles:
      - screenshots
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      SMSAPI_USE_MOCK: "1"
      HIDRIVE_USE_MOCK: "1"
      CAPTCHA_VERIFY_SKIP: "1"
      SCREENSHOT_BASE_URL: http://web:8000
    # Inline sh (bez pliku .sh z Windows CRLF, który psuje `set -e` w kontenerze)
    command:
      - sh
      - -c
      - |
        i=0
        until python -c "import urllib.request; urllib.request.urlopen('http://web:8000/admin/login/')" 2>/dev/null; do
          i=$$((i+1))
          if [ "$$i" -gt 90 ]; then echo "screenshots: web nie odpowiada po 3 minutach" >&2; exit 1; fi
          sleep 2
        done
        exec python scripts/capture_manual_screenshots.py --base-url http://web:8000
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  # One-off: nagrania WebM per rola (docs/manual) — ten sam obraz co screenshots
  # Uruchomienie: docker compose --profile manual-videos run --rm manual-videos
  manual-videos:
    build:
      context: .
      dockerfile: Dockerfile.screenshots
    profiles:
      - manual-videos
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      SMSAPI_USE_MOCK: "1"
      CAPTCHA_VERIFY_SKIP: "1"
      SCREENSHOT_BASE_URL: http://web:8000
    command:
      - sh
      - -c
      - |
        i=0
        until python -c "import urllib.request; urllib.request.urlopen('http://web:8000/admin/login/')" 2>/dev/null; do
          i=$$((i+1))
          if [ "$$i" -gt 90 ]; then echo "manual-videos: web nie odpowiada po 3 minutach" >&2; exit 1; fi
          sleep 2
        done
        exec python scripts/record_manual_videos.py --base-url http://web:8000 --role all --out-dir /app/docs/manual/assets/videos
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  # One-off: filmy SC-001–SC-027 (shared HiDrive mock JSON + web)
  # docker compose --profile scenario-videos run --rm scenario-videos
  scenario-videos:
    build:
      context: .
      dockerfile: Dockerfile.screenshots
    profiles:
      - scenario-videos
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      SMSAPI_USE_MOCK: "1"
      CAPTCHA_VERIFY_SKIP: "1"
      HIDRIVE_USE_MOCK: "1"
      HIDRIVE_INCOMING_PATH: ${HIDRIVE_INCOMING_PATH:-/public/incoming}
      SCREENSHOT_SKIP_DJANGO: "1"
    command:
      - sh
      - -c
      - |
        python scripts/manual_demo/seed_scenarios.py --all --write-ctx &&
        python scripts/manual_demo/seed_import_troubleshooting.py &&
        exec python scripts/record_scenario_videos.py --all --base-url http://web:8000 --slow-mo 500 \
          --out-dir /app/docs/manual/assets/videos/scenariusze
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_started

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./deploy/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    entrypoint:
      - /bin/sh
      - -c
      - |
        sed "s|__PROMETHEUS_METRICS_TOKEN__|$$PROMETHEUS_METRICS_TOKEN|g" /etc/prometheus/prometheus.yml.template > /tmp/prometheus.yml
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.console.libraries=/etc/prometheus/console_libraries \
          --web.console.templates=/etc/prometheus/consoles
    ports:
      - "9090:9090"
    depends_on:
      web:
        condition: service_started
      scheduler:
        condition: service_started
      postgres_exporter:
        condition: service_started
      node_exporter:
        condition: service_started
      otel-collector:
        condition: service_started
    links:
      - otel-collector:otelcollector
      - node_exporter:node_exporter
      - postgres_exporter:postgres_exporter
      - scheduler:scheduler

  alertmanager:
    image: prom/alertmanager:latest
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./deploy/prometheus:/etc/cogito-prometheus:ro
      - alertmanager_data:/alertmanager
    entrypoint:
      - /bin/sh
      - -c
      - |
        DEFAULT="$${ALERTMANAGER_WEBHOOK_URL:-http://127.0.0.1:5001/}"
        CRITICAL="$${ALERTMANAGER_WEBHOOK_CRITICAL_URL:-$$DEFAULT}"
        WARNING="$${ALERTMANAGER_WEBHOOK_WARNING_URL:-$$DEFAULT}"
        if [ "$${ALERTMANAGER_USE_DISCORD:-0}" = "1" ]; then
          SRC="/etc/cogito-prometheus/alertmanager.discord.yml.template"
        else
          SRC="/etc/cogito-prometheus/alertmanager.yml.template"
        fi
        sed -e "s#__WEBHOOK_DEFAULT__#$${DEFAULT}#g" \
            -e "s#__WEBHOOK_CRITICAL__#$${CRITICAL}#g" \
            -e "s#__WEBHOOK_WARNING__#$${WARNING}#g" \
            "$$SRC" > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    ports:
      - "9093:9093"

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./deploy/otel/otel-collector-config.yml:/etc/otel-collector-config.yml
    networks:
      default:
        aliases:
          - otelcollector
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8889:8889" # Prometheus exporter (spanmetrics)
    depends_on:
      - tempo

  tempo:
    image: grafana/tempo:latest
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/tmp/tempo
    ports:
      - "3200:3200"

volumes:
  postgres_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
  tempo_data:
