[pytest]
DJANGO_SETTINGS_MODULE = cogitomedica.settings
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
norecursedirs = mutants .git __pycache__ *.egg .eggs dist build
markers =
    e2e: Playwright browser E2E (requires E2E_BROWSER and installed browsers)
